<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Briefing Tactique - Strangereal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020602;
            color: #00ff41;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Effet scanline rétro global */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Balayage radar vertical (VHS Scan) */
        .radar-sweep {
            position: absolute;
            top: -20%;
            left: 0;
            width: 100%;
            height: 15%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.3) 80%, rgba(0, 255, 65, 0.8) 100%);
            animation: sweep 4s linear infinite;
            z-index: 15;
            pointer-events: none;
            opacity: 0.7;
            box-shadow: 0 10px 20px rgba(0, 255, 65, 0.2);
        }

        @keyframes sweep {
            0% { transform: translateY(-10vh); }
            100% { transform: translateY(120vh); }
        }

        .hud {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            padding: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            top: 20px;
            left: 20px;
            box-sizing: border-box;
            border: 2px solid rgba(0, 255, 65, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 65, 0.5);
            padding-bottom: 10px;
            gap: 15px;
        }

        .hud-title {
            font-size: 1.3rem;
            text-shadow: 0 0 5px #00ff41;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* BLOC CENTRAL DE L'EN-TÊTE : MÉTÉO & HORLOGE */
        .hud-info-group {
            display: flex;
            align-items: center;
            gap: 25px;
            white-space: nowrap;
        }

        .hud-weather {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3rem;
            text-shadow: 0 0 5px #00ff41;
        }

        .weather-icon {
            width: 24px;
            height: 24px;
            fill: #00ff41;
            filter: drop-shadow(0 0 3px #00ff41);
        }

        /* STYLE DE L'HORLOGE */
        .hud-clock {
            font-size: 1.3rem;
            text-shadow: 0 0 5px #00ff41;
            letter-spacing: 2px;
        }

        /* CONTENEUR DES BOUTONS DE SPAWN (EN HAUT) */
        .hud-controls {
            position: absolute;
            top: 75px; 
            left: 20px;
            right: 20px;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
        }

        .btn-tactical {
            background: rgba(0, 0, 0, 0.8);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            padding: 10px 20px;
            border: 1px solid;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease-out;
            letter-spacing: 1px;
        }

        .btn-tactical:active {
            transform: scale(0.95);
        }

        .btn-ally {
            color: #00bfff;
            border-color: #00bfff;
            box-shadow: inset 0 0 10px rgba(0, 191, 255, 0.2), 0 0 5px rgba(0, 191, 255, 0.3);
            text-shadow: 0 0 5px #00bfff;
        }

        .btn-ally:hover {
            background: rgba(0, 191, 255, 0.2);
            box-shadow: inset 0 0 15px rgba(0, 191, 255, 0.4), 0 0 10px #00bfff;
        }

        .btn-enemy {
            color: #ff003c;
            border-color: #ff003c;
            box-shadow: inset 0 0 10px rgba(255, 0, 60, 0.2), 0 0 5px rgba(255, 0, 60, 0.3);
            text-shadow: 0 0 5px #ff003c;
        }

        .btn-enemy:hover {
            background: rgba(255, 0, 60, 0.2);
            box-shadow: inset 0 0 15px rgba(255, 0, 60, 0.4), 0 0 10px #ff003c;
        }

        #viewport {
            width: 100%;
            height: 100%;
            position: relative;
            touch-action: none; 
            z-index: 1;
        }

       #tactical-map {
            width: 3000px; 
            height: 1500px;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        #map-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.7;
            filter: grayscale(100%) contrast(150%) brightness(60%) sepia(100%) hue-rotate(80deg) drop-shadow(0 0 10px rgba(0, 255, 65, 0.5));
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none; 
            -webkit-user-drag: none;
            user-select: none;
        }

        /* Marqueurs tactiques */
        .marker {
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid #00bfff;
            background-color: rgba(0, 191, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00bfff;
        }
        .marker::after {
            content: attr(data-label);
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00bfff;
            font-size: 14px;
            white-space: nowrap;
            text-shadow: 0 0 5px #00bfff;
            background: rgba(0,0,0,0.7);
            padding: 2px 5px;
            border-left: 2px solid #00bfff;
        }
        .marker.enemy {
            border-color: #ff003c;
            background-color: rgba(255, 0, 60, 0.3);
            box-shadow: 0 0 10px #ff003c;
        }
        .marker.enemy::after {
            color: #ff003c;
            text-shadow: 0 0 5px #ff003c;
            border-left-color: #ff003c;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }
        .marker-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            border: 2px solid #ff003c;
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-out;
            pointer-events: none;
        }

        #units-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .unit {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: currentColor;
            clip-path: polygon(100% 50%, 0% 0%, 0% 100%);
            will-change: transform;
            transform-origin: center;
        }
        .unit.ally { color: #00bfff; filter: drop-shadow(0 0 3px #00bfff); }
        .unit.enemy { color: #ff003c; filter: drop-shadow(0 0 3px #ff003c); }

        .explosion {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: explode 0.4s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; background: #ff003c; }
        }

    </style>
</head>
<body>

    <div class="radar-sweep"></div>

    <div class="hud">
        <div class="hud-header">
            <div class="hud-title">> NANTES NORD // AWACS UPDATE</div>
            
            <div class="hud-info-group">
                <!-- BLOC MÉTÉO -->
                <div class="hud-weather" id="weather-container" title="Météo Nantes Nord">
                    <svg id="weather-icon" class="weather-icon" viewBox="0 0 24 24">
                        <!-- Icône Soleil par défaut -->
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>
                        <line x1="12" y1="21" x2="12" y2="23" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>
                        <line x1="1" y1="12" x2="3" y2="12" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>
                        <line x1="21" y1="12" x2="23" y2="12" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span id="weather-temp">--°C</span>
                </div>
                
                <!-- HORLOGE -->
                <div id="hud-clock" class="hud-clock">00:00:00</div>
            </div>
        </div>
        
        <div class="hud-controls">
            <button id="btn-spawn-ally" class="btn-tactical btn-ally">> DEPLOY ALLY</button>
            <button id="btn-spawn-enemy" class="btn-tactical btn-enemy">> DEPLOY ENEMY</button>
        </div>
    </div>

    <div id="viewport">
        <div id="tactical-map">
            <img id="map-image" src="https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg" alt="Strangereal Map" draggable="false">
            
            <div class="marker enemy objective" style="left: 1500px; top: 750px;" data-label="B7R [La Table Ronde]">
                <div class="marker-pulse"></div>
            </div>
            <div class="marker objective" style="left: 2100px; top: 500px;" data-label="Gracemeria"></div>
            <div class="marker objective" style="left: 900px; top: 900px;" data-label="Oured"></div>
            <div class="marker enemy objective" style="left: 2500px; top: 1200px;" data-label="Comberth Harbor"></div>

            <div id="units-layer"></div>
        </div>
    </div>

    <script>
        /* GESTION DE L'HORLOGE ET DE LA MÉTÉO */
        function updateClock() {
            const clockElement = document.getElementById('hud-clock');
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            clockElement.textContent = `${hours}:${minutes}:${seconds}`;
        }
        
        updateClock();
        setInterval(updateClock, 1000);

        // Formats vectoriels SVG adaptés au thème tactique HUD pour chaque type de météo
        const weatherPaths = {
            sunny: '<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="5" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="22" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/><line x1="2" y1="12" x2="5" y2="12" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="12" x2="22" y2="12" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/><line x1="4.93" y1="4.93" x2="7.05" y2="7.05" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/><line x1="16.95" y1="16.95" x2="19.07" y2="19.07" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/><line x1="4.93" y1="19.07" x2="7.05" y2="16.95" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/><line x1="16.95" y1="4.93" x2="19.07" y2="7.05" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>',
            cloudy: '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" stroke="#00ff41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
            rain: '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" stroke="#00ff41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="22" x2="6" y2="25" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="22" x2="10" y2="25" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="22" x2="14" y2="25" stroke="#00ff41" stroke-width="2" stroke-linecap="round"/>',
            storm: '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" stroke="#00ff41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="13 16 10 20 13 20 10 24" fill="none" stroke="#00ff41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
        };

        async function fetchWeatherNantesNord() {
            try {
                // Coordonnées approximatives de Nantes Nord (environ 47.25°N, -1.55°W)
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=47.25&longitude=-1.55&current=temperature_2m,weather_code');
                const data = await response.json();
                
                if (data && data.current) {
                    const temp = Math.round(data.current.temperature_2m);
                    const code = data.current.weather_code;
                    
                    document.getElementById('weather-temp').textContent = `${temp}°C`;
                    
                    const iconSvg = document.getElementById('weather-icon');
                    let weatherType = 'sunny';
                    
                    // Codes WMO météo standard
                    if (code >= 50 && code <= 67 || code >= 80 && code <= 82) {
                        weatherType = 'rain';
                    } else if (code >= 95) {
                        weatherType = 'storm';
                    } else if (code >= 1 && code <= 3 || code >= 45 && code <= 48) {
                        weatherType = 'cloudy';
                    }
                    
                    iconSvg.innerHTML = weatherPaths[weatherType];
                }
            } catch (e) {
                // Fallback silencieux en cas d'absence de réseau
                document.getElementById('weather-temp').textContent = '24°C';
            }
        }

        fetchWeatherNantesNord();
        // Actualisation météo toutes les 15 minutes
        setInterval(fetchWeatherNantesNord, 900000);


        /* GESTION DE LA NAVIGATION DE LA CARTE */
        const viewport = document.getElementById('viewport');
        const map = document.getElementById('tactical-map');

        const mapWidth = 3000;
        const mapHeight = 1500;

        let scale = 0.5;
        let panX = 0;
        let panY = 0;
        let minScale = 0.1;

        let isDragging = false;
        let startX, startY;
        let lastDistance = null;

        function initMap() {
            const rect = viewport.getBoundingClientRect();
            
            minScale = Math.min(rect.width / mapWidth, rect.height / mapHeight);
            scale = Math.max(0.5, minScale); 
            
            panX = (rect.width - (mapWidth * scale)) / 2;
            panY = (rect.height - (mapHeight * scale)) / 2;
            
            updateTransform();
        }

        window.addEventListener('resize', () => {
            const rect = viewport.getBoundingClientRect();
            minScale = Math.min(rect.width / mapWidth, rect.height / mapHeight);
            updateTransform();
        });

        function updateTransform() {
            const rect = viewport.getBoundingClientRect();
            scale = Math.min(Math.max(minScale, scale), 3);
            
            const scaledWidth = mapWidth * scale;
            const scaledHeight = mapHeight * scale;

            if (scaledWidth <= rect.width) {
                panX = (rect.width - scaledWidth) / 2;
            } else {
                panX = Math.max(rect.width - scaledWidth, Math.min(panX, 0));
            }

            if (scaledHeight <= rect.height) {
                panY = (rect.height - scaledHeight) / 2;
            } else {
                panY = Math.max(rect.height - scaledHeight, Math.min(panY, 0));
            }

            map.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        // --- Souris ---
        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            viewport.style.cursor = 'grabbing';
        });
        
        window.addEventListener('mouseup', () => {
            isDragging = false;
            viewport.style.cursor = 'crosshair';
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            
            updateTransform();
            
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });
        
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomAmount = -e.deltaY * 0.001;
            const newScale = Math.min(Math.max(minScale, scale + zoomAmount), 3);
            
            const mapX = (e.clientX - panX) / scale;
            const mapY = (e.clientY - panY) / scale;

            scale = newScale;

            panX = e.clientX - (mapX * scale);
            panY = e.clientY - (mapY * scale);

            updateTransform();
        }, { passive: false });

        // --- Tactile ---
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                lastDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            if (e.touches.length === 1 && isDragging) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                
                updateTransform();
                
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - startY;
                
            } else if (e.touches.length === 2) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                
                if (lastDistance) {
                    const scaleRatio = currentDistance / lastDistance;
                    const newScale = Math.min(Math.max(minScale, scale * scaleRatio), 3);
                    
                    const mapX = (centerX - panX) / scale;
                    const mapY = (centerY - panY) / scale;
                    
                    scale = newScale;
                    
                    panX = centerX - (mapX * scale);
                    panY = centerY - (mapY * scale);
                }
                
                lastDistance = currentDistance;
                updateTransform();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) lastDistance = null;
            if (e.touches.length === 0) isDragging = false;
            else if (e.touches.length === 1) {
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
                isDragging = true;
            }
        });

        initMap();

        /* IA, DEPLACEMENTS & COLLISIONS */
        const unitsLayer = document.getElementById('units-layer');
        const objectivesElements = document.querySelectorAll('.objective');

        const waypoints = Array.from(objectivesElements).map(el => {
            return {
                x: parseFloat(el.style.left),
                y: parseFloat(el.style.top),
                isEnemy: el.classList.contains('enemy')
            };
        });

        let units = [];
        let time = 0;

        function spawnUnit(type, x = null, y = null) {
            if (x === null) x = Math.random() * mapWidth;
            if (y === null) y = Math.random() * mapHeight;

            const el = document.createElement('div');
            el.className = `unit ${type}`;
            unitsLayer.appendChild(el);

            const unit = {
                el: el,
                type: type,
                x: x,
                y: y,
                angle: Math.random() * Math.PI * 2,
                speed: 1 + Math.random(),
                targetWp: null,
                active: true,
                orbitAngle: Math.random() * Math.PI * 2,
                orbitRadius: 100 + Math.random() * 200,
                baseX: x,
                baseY: y,
                mode: 'patrol' 
            };
            units.push(unit);
            return unit;
        }

        document.getElementById('btn-spawn-ally').addEventListener('click', () => {
            spawnUnit('ally');
        });

        document.getElementById('btn-spawn-enemy').addEventListener('click', () => {
            spawnUnit('enemy');
        });

        function destroyUnit(index) {
            const unit = units[index];
            unit.active = false;
            
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = `${unit.x}px`;
            explosion.style.top = `${unit.y}px`;
            unitsLayer.appendChild(explosion);
            
            unit.el.remove();
            units.splice(index, 1);
            
            setTimeout(() => {
                explosion.remove();
            }, 400);
        }

        function checkCollisions() {
            for (let i = 0; i < units.length; i++) {
                for (let j = i + 1; j < units.length; j++) {
                    const u1 = units[i];
                    const u2 = units[j];
                    if (u1.type !== u2.type && u1.active && u2.active) {
                        const dist = Math.hypot(u1.x - u2.x, u1.y - u2.y);
                        if (dist < 20) {
                            destroyUnit(j);
                            destroyUnit(i);
                            return; 
                        }
                    }
                }
            }
        }

        function animate() {
            time += 0.05;

            units.forEach(unit => {
                if (!unit.active) return;

                if (Math.random() < 0.005) {
                    unit.mode = Math.random() > 0.5 ? 'patrol' : 'intercept';
                }

                if (unit.mode === 'patrol') {
                    if (!unit.targetWp || Math.random() < 0.01) {
                        const validWps = waypoints.filter(wp => (unit.type === 'enemy' ? wp.isEnemy : !wp.isEnemy));
                        if(validWps.length > 0) {
                             unit.targetWp = validWps[Math.floor(Math.random() * validWps.length)];
                             unit.baseX = unit.targetWp.x;
                             unit.baseY = unit.targetWp.y;
                        }
                    }

                    unit.orbitAngle += (unit.speed * 0.02);
                    
                    const targetX = unit.baseX + Math.cos(unit.orbitAngle) * unit.orbitRadius;
                    const targetY = unit.baseY + Math.sin(unit.orbitAngle) * unit.orbitRadius;

                    const dx = targetX - unit.x;
                    const dy = targetY - unit.y;
                    const targetAngle = Math.atan2(dy, dx);
                    
                    let angleDiff = targetAngle - unit.angle;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    
                    unit.angle += angleDiff * 0.05;

                } else if (unit.mode === 'intercept') {
                    let closestEnemy = null;
                    let minDist = Infinity;
                    
                    units.forEach(other => {
                        if (other.type !== unit.type && other.active) {
                            const dist = Math.hypot(other.x - unit.x, other.y - unit.y);
                            if (dist < minDist) {
                                minDist = dist;
                                closestEnemy = other;
                            }
                        }
                    });

                    if (closestEnemy && minDist < 1000) {
                        const dx = closestEnemy.x - unit.x;
                        const dy = closestEnemy.y - unit.y;
                        const targetAngle = Math.atan2(dy, dx);
                        
                        let angleDiff = targetAngle - unit.angle;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        
                        unit.angle += angleDiff * 0.08; 
                    } else {
                        unit.mode = 'patrol'; 
                    }
                }

                unit.x += Math.cos(unit.angle) * unit.speed * 2;
                unit.y += Math.sin(unit.angle) * unit.speed * 2;

                const deg = unit.angle * (180 / Math.PI);
                unit.el.style.transform = `translate(${unit.x}px, ${unit.y}px) rotate(${deg}deg)`;
            });

            checkCollisions();
            requestAnimationFrame(animate);
        }

        for (let i = 0; i < 5; i++) spawnUnit('ally', 1000 + Math.random()*200, 1000 + Math.random()*200);
        for (let i = 0; i < 6; i++) spawnUnit('enemy', 1800 + Math.random()*200, 600 + Math.random()*200);

        animate();
    </script>
</body>
</html>
