<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Briefing Tactique - Strangereal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --hud-color: #ffaa00;
            --hud-glow: rgba(255, 170, 0, 0.3);
            --hud-glow-intense: rgba(255, 170, 0, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a0800;
            color: var(--hud-color);
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.3s ease;
        }

        /* GRISE GLOBALE SUR TOUT LE WIDGET */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-image: 
                linear-gradient(rgba(255, 170, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 170, 0, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(255, 170, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 50px 50px, 50px 50px, 100% 2px, 3px 100%;
            z-index: 20;
            pointer-events: none;
        }

        .radar-sweep {
            position: absolute;
            top: -20%; left: 0;
            width: 100%; height: 15%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255, 255, 255, 0.3) 80%, var(--hud-glow-intense));
            animation: sweep 4s linear infinite;
            z-index: 21; /* Au-dessus de la grille globale */
            pointer-events: none;
            opacity: 0.7;
            box-shadow: 0 10px 20px var(--hud-glow);
        }

        @keyframes sweep {
            0% { transform: translateY(-10vh); }
            100% { transform: translateY(120vh); }
        }

        .hud {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            padding: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 40px);
            top: 20px; left: 20px;
            box-sizing: border-box;
            border: 2px solid var(--hud-glow);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 0 10px var(--hud-glow);
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--hud-glow);
            padding-bottom: 10px;
            gap: 15px;
        }

        .hud-title {
            font-size: 1.3rem;
            text-shadow: 0 0 5px var(--hud-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hud-info-group {
            display: flex;
            align-items: center;
            gap: 20px;
            white-space: nowrap;
            pointer-events: auto;
        }

        .hud-weather {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3rem;
            text-shadow: 0 0 5px var(--hud-color);
        }

        .weather-icon, .settings-icon {
            width: 24px;
            height: 24px;
            fill: var(--hud-color);
            stroke: var(--hud-color);
            filter: drop-shadow(0 0 3px var(--hud-color));
        }

        .btn-settings {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .btn-settings:hover {
            transform: rotate(45deg);
        }

        .hud-clock {
            font-size: 1.3rem;
            text-shadow: 0 0 5px var(--hud-color);
            letter-spacing: 2px;
        }

        .hud-controls {
            position: absolute;
            top: 75px; left: 20px; right: 20px;
            pointer-events: auto;
            display: flex;
            justify-content: space-between;
        }

        .btn-tactical {
            background: rgba(0, 0, 0, 0.8);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            padding: 10px 20px;
            border: 1px solid;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease-out;
            letter-spacing: 1px;
        }

        .btn-tactical:active { transform: scale(0.95); }

        .btn-ally {
            color: #00bfff;
            border-color: #00bfff;
            box-shadow: inset 0 0 10px rgba(0, 191, 255, 0.2), 0 0 5px rgba(0, 191, 255, 0.3);
            text-shadow: 0 0 5px #00bfff;
        }
        .btn-ally:hover { background: rgba(0, 191, 255, 0.2); }

        .btn-enemy {
            color: #ff003c;
            border-color: #ff003c;
            box-shadow: inset 0 0 10px rgba(255, 0, 60, 0.2), 0 0 5px rgba(255, 0, 60, 0.3);
            text-shadow: 0 0 5px #ff003c;
        }
        .btn-enemy:hover { background: rgba(255, 0, 60, 0.2); }

        /* SCOREBOARD EN BAS */
        .hud-scoreboard {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 25px;
            border: 1px solid var(--hud-glow);
            box-shadow: 0 0 15px var(--hud-glow);
            pointer-events: auto;
            letter-spacing: 1px;
        }
        .score-ally { color: #00bfff; text-shadow: 0 0 5px #00bfff; }
        .score-enemy { color: #ff003c; text-shadow: 0 0 5px #ff003c; }

        /* KILLFEED EN BAS À DROITE */
        .killfeed-container {
            position: absolute;
            bottom: 70px; right: 20px;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            align-items: flex-end;
            z-index: 40;
            pointer-events: none;
            max-width: 300px;
        }

        .killfeed-item {
            background: rgba(0, 0, 0, 0.85);
            border-left: 3px solid;
            padding: 6px 12px;
            font-size: 0.85rem;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            animation: fadeInOut 5s forwards;
            white-space: nowrap;
            letter-spacing: 1px;
        }
        .killfeed-item.ally { border-color: #00bfff; color: #00bfff; text-shadow: 0 0 4px #00bfff; }
        .killfeed-item.enemy { border-color: #ff003c; color: #ff003c; text-shadow: 0 0 4px #ff003c; }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(20px); }
            10% { opacity: 1; transform: translateX(0); }
            80% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(20px); display: none; }
        }

        #settings-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #settings-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #1a0800;
            border: 2px solid var(--hud-color);
            box-shadow: 0 0 25px var(--hud-glow);
            padding: 30px;
            width: 350px;
            box-sizing: border-box;
            position: relative;
        }

        .modal-header {
            font-size: 1.2rem;
            border-bottom: 1px solid var(--hud-glow);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--hud-color);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            text-shadow: 0 0 5px var(--hud-color);
        }

        .setting-group { margin-bottom: 20px; }
        .setting-group label { display: block; margin-bottom: 8px; font-size: 0.95rem; letter-spacing: 1px; }
        .setting-group input[type="text"] {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--hud-color);
            color: var(--hud-color);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        #viewport {
            width: 100%; height: 100%;
            position: relative;
            touch-action: none; 
            z-index: 1;
        }

        #tactical-map {
            width: 3000px; height: 1500px;
            position: absolute;
            top: 0; left: 0;
            transform-origin: 0 0;
            will-change: transform;
        }

        #map-image {
            width: 100%; height: 100%;
            object-fit: contain;
            opacity: 0.7;
            filter: grayscale(100%) contrast(150%) brightness(60%) sepia(100%) hue-rotate(300deg) drop-shadow(0 0 10px var(--hud-glow));
            position: absolute;
            top: 0; left: 0;
            z-index: -1;
            pointer-events: none; 
            user-select: none;
        }

        .marker {
            position: absolute;
            width: 15px; height: 15px;
            border: 2px solid #00bfff;
            background-color: rgba(0, 191, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00bfff;
        }
        .marker::after {
            content: attr(data-label);
            position: absolute;
            top: 20px; left: 20px;
            color: #00bfff;
            font-size: 14px;
            white-space: nowrap;
            text-shadow: 0 0 5px #00bfff;
            background: rgba(0,0,0,0.7);
            padding: 2px 5px;
            border-left: 2px solid #00bfff;
        }
        .marker.enemy {
            border-color: #ff003c;
            background-color: rgba(255, 0, 60, 0.3);
            box-shadow: 0 0 10px #ff003c;
        }
        .marker.enemy::after {
            color: #ff003c;
            text-shadow: 0 0 5px #ff003c;
            border-left-color: #ff003c;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }
        .marker-pulse {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            border: 2px solid #ff003c;
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-out;
            pointer-events: none;
        }

        #units-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .unit {
            position: absolute;
            width: 16px; height: 16px;
            background-color: currentColor;
            clip-path: polygon(100% 50%, 0% 0%, 0% 100%);
            will-change: transform;
            transform-origin: center;
            z-index: 6;
        }
        .unit.ally { color: #00bfff; filter: drop-shadow(0 0 3px #00bfff); }
        .unit.enemy { color: #ff003c; filter: drop-shadow(0 0 3px #ff003c); }

        .trail {
            position: absolute;
            width: 4px; height: 4px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 4;
            will-change: opacity;
        }
        .trail.ally { background-color: #00bfff; box-shadow: 0 0 2px #00bfff; }
        .trail.enemy { background-color: #ff003c; box-shadow: 0 0 2px #ff003c; }

        .explosion {
            position: absolute;
            width: 20px; height: 20px;
            background: #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: explode 0.4s ease-out forwards;
            z-index: 7;
        }
        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; background: #ff003c; }
        }
    </style>
</head>
<body>

    <div class="radar-sweep"></div>

    <div class="hud">
        <div class="hud-header">
            <div id="hud-title" class="hud-title">> NANTES NORD // AWACS UPDATE</div>
            
            <div class="hud-info-group">
                <div class="hud-weather" id="weather-container">
                    <svg id="weather-icon" class="weather-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="4"></circle>
                        <line x1="12" y1="2" x2="12" y2="5" stroke-width="2" stroke-linecap="round"/>
                        <line x1="12" y1="19" x2="12" y2="22" stroke-width="2" stroke-linecap="round"/>
                        <line x1="2" y1="12" x2="5" y2="12" stroke-width="2" stroke-linecap="round"/>
                        <line x1="19" y1="12" x2="22" y2="12" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span id="weather-temp">--°C</span>
                </div>
                
                <div id="hud-clock" class="hud-clock">00:00:00</div>

                <button id="btn-open-settings" class="btn-settings" title="Paramètres HUD">
                    <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="21" x2="4" y2="14"></line>
                        <line x1="4" y1="10" x2="4" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12" y2="3"></line>
                        <line x1="20" y1="21" x2="20" y2="16"></line>
                        <line x1="20" y1="12" x2="20" y2="3"></line>
                        <line x1="1" y1="14" x2="7" y2="14"></line>
                        <line x1="9" y1="8" x2="15" y2="8"></line>
                        <line x1="17" y1="16" x2="23" y2="16"></line>
                    </svg>
                </button>
            </div>
        </div>
        
        <div class="hud-controls">
            <button id="btn-spawn-ally" class="btn-tactical btn-ally">> DEPLOY ALLY</button>
            <button id="btn-spawn-enemy" class="btn-tactical btn-enemy">> DEPLOY ENEMY</button>
        </div>

        <!-- TABLEAU DES SCORES EN BAS -->
        <div class="hud-scoreboard">
            <span class="score-ally">ALLIES: <span id="score-ally-val">0</span></span>
            <span class="score-enemy">ENEMIES: <span id="score-enemy-val">0</span></span>
        </div>
    </div>

    <!-- KILLFEED EN BAS À DROITE -->
    <div id="killfeed" class="killfeed-container"></div>

    <div id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>> PARAMÈTRES SYSTÈME</span>
                <button id="btn-close-settings" class="modal-close">[X]</button>
            </div>
            <div class="setting-group">
                <label for="location-search">> SECTEUR MÉTÉO (VILLE)</label>
                <input type="text" id="location-search" placeholder="Ex: Nantes, Paris, Tokyo...">
            </div>
        </div>
    </div>

    <div id="viewport">
        <div id="tactical-map">
            <img id="map-image" src="https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg" alt="Strangereal Map" draggable="false">
            
            <div class="marker enemy objective" style="left: 1500px; top: 750px;" data-label="B7R [La Table Ronde]">
                <div class="marker-pulse"></div>
            </div>
            <div class="marker objective" style="left: 2100px; top: 500px;" data-label="Gracemeria"></div>
            <div class="marker objective" style="left: 900px; top: 900px;" data-label="Oured"></div>
            <div class="marker enemy objective" style="left: 2500px; top: 1200px;" data-label="Comberth Harbor"></div>

            <div id="units-layer"></div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('settings-modal');
        document.getElementById('btn-open-settings').addEventListener('click', () => modal.classList.add('active'));
        document.getElementById('btn-close-settings').addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

        function updateClock() {
            const clockElement = document.getElementById('hud-clock');
            const now = new Date();
            clockElement.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        const weatherPaths = {
            sunny: '<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="5" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="22" stroke-width="2" stroke-linecap="round"/><line x1="2" y1="12" x2="5" y2="12" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="12" x2="22" y2="12" stroke-width="2" stroke-linecap="round"/>',
            cloudy: '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
            rain: '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="22" x2="6" y2="25" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="22" x2="10" y2="25" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="22" x2="14" y2="25" stroke-width="2" stroke-linecap="round"/>',
            storm: '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="13 16 10 20 13 20 10 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
        };

        async function fetchWeather(lat, lon, locationName) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`);
                const data = await response.json();
                if (data && data.current) {
                    document.getElementById('weather-temp').textContent = `${Math.round(data.current.temperature_2m)}°C`;
                    document.getElementById('hud-title').textContent = `> ${locationName.toUpperCase()} // AWACS UPDATE`;
                    const code = data.current.weather_code;
                    let weatherType = 'sunny';
                    if (code >= 50 && code <= 67 || code >= 80 && code <= 82) weatherType = 'rain';
                    else if (code >= 95) weatherType = 'storm';
                    else if (code >= 1 && code <= 3 || code >= 45 && code <= 48) weatherType = 'cloudy';
                    document.getElementById('weather-icon').innerHTML = weatherPaths[weatherType];
                }
            } catch (e) { console.error("Erreur météo", e); }
        }

        fetchWeather(47.25, -1.55, "Nantes Nord");

        const searchInput = document.getElementById('location-search');
        let searchTimeout = null;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if (query.length < 2) return;
            searchTimeout = setTimeout(async () => {
                try {
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=fr`);
                    const geoData = await geoRes.json();
                    if (geoData && geoData.results && geoData.results.length > 0) {
                        fetchWeather(geoData.results[0].latitude, geoData.results[0].longitude, geoData.results[0].name);
                    }
                } catch (err) { console.error("Erreur géocodage", err); }
            }, 500);
        });

        const viewport = document.getElementById('viewport');
        const map = document.getElementById('tactical-map');
        const mapWidth = 3000, mapHeight = 1500;
        let scale = 0.5, panX = 0, panY = 0, minScale = 0.1;
        let isDragging = false, startX, startY, lastDistance = null;

        function initMap() {
            const rect = viewport.getBoundingClientRect();
            minScale = Math.min(rect.width / mapWidth, rect.height / mapHeight);
            scale = Math.max(0.5, minScale); 
            panX = (rect.width - (mapWidth * scale)) / 2;
            panY = (rect.height - (mapHeight * scale)) / 2;
            updateTransform();
        }

        window.addEventListener('resize', () => {
            const rect = viewport.getBoundingClientRect();
            minScale = Math.min(rect.width / mapWidth, rect.height / mapHeight);
            updateTransform();
        });

        function updateTransform() {
            const rect = viewport.getBoundingClientRect();
            scale = Math.min(Math.max(minScale, scale), 3);
            const scaledWidth = mapWidth * scale, scaledHeight = mapHeight * scale;
            panX = scaledWidth <= rect.width ? (rect.width - scaledWidth) / 2 : Math.max(rect.width - scaledWidth, Math.min(panX, 0));
            panY = scaledHeight <= rect.height ? (rect.height - scaledHeight) / 2 : Math.max(rect.height - scaledHeight, Math.min(panY, 0));
            map.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        viewport.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; viewport.style.cursor = 'grabbing'; });
        window.addEventListener('mouseup', () => { isDragging = false; viewport.style.cursor = 'crosshair'; });
        window.addEventListener('mousemove', (e) => { if (!isDragging) return; panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); });
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const newScale = Math.min(Math.max(minScale, scale - e.deltaY * 0.001), 3);
            const mapX = (e.clientX - panX) / scale, mapY = (e.clientY - panY) / scale;
            scale = newScale; panX = e.clientX - (mapX * scale); panY = e.clientY - (mapY * scale);
            updateTransform();
        }, { passive: false });

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { isDragging = true; startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY; }
            else if (e.touches.length === 2) { isDragging = false; lastDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                e.preventDefault(); panX = e.touches[0].clientX - startX; panY = e.touches[0].clientY - startY; updateTransform();
            } else if (e.touches.length === 2) {
                e.preventDefault();
                const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2, centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                if (lastDistance) {
                    const newScale = Math.min(Math.max(minScale, scale * (currentDistance / lastDistance)), 3);
                    const mapX = (centerX - panX) / scale, mapY = (centerY - panY) / scale;
                    scale = newScale; panX = centerX - (mapX * scale); panY = centerY - (mapY * scale);
                }
                lastDistance = currentDistance; updateTransform();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) lastDistance = null;
            isDragging = e.touches.length === 1;
            if (isDragging) { startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY; }
        });

        initMap();

        const unitsLayer = document.getElementById('units-layer');
        const waypoints = Array.from(document.querySelectorAll('.objective')).map(el => ({
            x: parseFloat(el.style.left), y: parseFloat(el.style.top), isEnemy: el.classList.contains('enemy')
        }));

        let units = [];
        let frameCount = 0;
        let scores = { ally: 0, enemy: 0 };

        function recordKill(killer, victim) {
            scores[killer.type]++;
            document.getElementById('score-ally-val').textContent = scores.ally;
            document.getElementById('score-enemy-val').textContent = scores.enemy;

            const killfeed = document.getElementById('killfeed');
            const item = document.createElement('div');
            item.className = `killfeed-item ${killer.type}`;
            
            const killerName = killer.type === 'ally' ? 'ALLIED UNIT' : 'HOSTILE BANDIT';
            const victimName = victim.type === 'ally' ? 'ALLIED UNIT' : 'HOSTILE BANDIT';
            item.textContent = `> ${killerName} DESTROYED ${victimName}`;
            
            killfeed.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 5000);
        }

        function spawnUnit(type, x = null, y = null) {
            if (x === null) x = Math.random() * mapWidth;
            if (y === null) y = Math.random() * mapHeight;

            const el = document.createElement('div');
            el.className = `unit ${type}`;
            unitsLayer.appendChild(el);

            const unit = {
                el, type, x, y,
                angle: Math.random() * Math.PI * 2,
                speed: 1 + Math.random(),
                targetWp: null,
                active: true,
                orbitAngle: Math.random() * Math.PI * 2,
                orbitRadius: 100 + Math.random() * 200,
                baseX: x, baseY: y,
                mode: 'patrol',
                trailPoints: []
            };
            units.push(unit);
            return unit;
        }

        document.getElementById('btn-spawn-ally').addEventListener('click', () => spawnUnit('ally'));
        document.getElementById('btn-spawn-enemy').addEventListener('click', () => spawnUnit('enemy'));

        function destroyUnit(index) {
            const unit = units[index];
            unit.active = false;
            
            const explosion = document.createElement('div');
            explosion.className = 'explosion';
            explosion.style.left = `${unit.x}px`;
            explosion.style.top = `${unit.y}px`;
            unitsLayer.appendChild(explosion);
            
            unit.el.remove();
            unit.trailPoints.forEach(p => p.el.remove());
            units.splice(index, 1);
            
            setTimeout(() => explosion.remove(), 400);
        }

        function checkCollisions() {
            for (let i = 0; i < units.length; i++) {
                for (let j = i + 1; j < units.length; j++) {
                    const u1 = units[i], u2 = units[j];
                    if (u1.type !== u2.type && u1.active && u2.active) {
                        if (Math.hypot(u1.x - u2.x, u1.y - u2.y) < 20) {
                            if (Math.random() < 0.5) {
                                recordKill(u2, u1);
                                destroyUnit(i);
                            } else {
                                recordKill(u1, u2);
                                destroyUnit(j);
                            }
                            return; 
                        }
                    }
                }
            }
        }

        function animate() {
            frameCount++;
            const shouldAddTrail = (frameCount % 3 === 0);

            units.forEach(unit => {
                if (!unit.active) return;

                if (Math.random() < 0.005) {
                    unit.mode = Math.random() > 0.5 ? 'patrol' : 'intercept';
                }

                if (unit.mode === 'patrol') {
                    if (!unit.targetWp || Math.random() < 0.01) {
                        const validWps = waypoints.filter(wp => (unit.type === 'enemy' ? wp.isEnemy : !wp.isEnemy));
                        if(validWps.length > 0) {
                             unit.targetWp = validWps[Math.floor(Math.random() * validWps.length)];
                             unit.baseX = unit.targetWp.x; unit.baseY = unit.targetWp.y;
                        }
                    }

                    unit.orbitAngle += (unit.speed * 0.02);
                    const targetX = unit.baseX + Math.cos(unit.orbitAngle) * unit.orbitRadius;
                    const targetY = unit.baseY + Math.sin(unit.orbitAngle) * unit.orbitRadius;
                    const targetAngle = Math.atan2(targetY - unit.y, targetX - unit.x);
                    
                    let angleDiff = targetAngle - unit.angle;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    unit.angle += angleDiff * 0.05;

                } else if (unit.mode === 'intercept') {
                    let closestEnemy = null, minDist = Infinity;
                    units.forEach(other => {
                        if (other.type !== unit.type && other.active) {
                            const dist = Math.hypot(other.x - unit.x, other.y - unit.y);
                            if (dist < minDist) { minDist = dist; closestEnemy = other; }
                        }
                    });

                    if (closestEnemy && minDist < 1000) {
                        const targetAngle = Math.atan2(closestEnemy.y - unit.y, closestEnemy.x - unit.x);
                        let angleDiff = targetAngle - unit.angle;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        unit.angle += angleDiff * 0.08; 
                    } else {
                        unit.mode = 'patrol'; 
                    }
                }

                unit.x += Math.cos(unit.angle) * unit.speed * 2;
                unit.y += Math.sin(unit.angle) * unit.speed * 2;

                if (shouldAddTrail) {
                    const trailX = unit.x + 8;
                    const trailY = unit.y + 8;

                    const trailEl = document.createElement('div');
                    trailEl.className = `trail ${unit.type}`;
                    trailEl.style.left = `${trailX}px`;
                    trailEl.style.top = `${trailY}px`;
                    unitsLayer.insertBefore(trailEl, unit.el); 

                    unit.trailPoints.push({ el: trailEl, age: 0 });
                }

                for (let k = unit.trailPoints.length - 1; k >= 0; k--) {
                    let p = unit.trailPoints[k];
                    p.age += 3;
                    if (p.age > 120) {
                        p.el.remove();
                        unit.trailPoints.splice(k, 1);
                    } else {
                        p.el.style.opacity = 1 - (p.age / 120);
                    }
                }

                unit.el.style.transform = `translate(${unit.x}px, ${unit.y}px) rotate(${unit.angle * (180 / Math.PI)}deg)`;
            });

            checkCollisions();
            requestAnimationFrame(animate);
        }

        for (let i = 0; i < 5; i++) spawnUnit('ally', 1000 + Math.random()*200, 1000 + Math.random()*200);
        for (let i = 0; i < 6; i++) spawnUnit('enemy', 1800 + Math.random()*200, 600 + Math.random()*200);

        animate();
    </script>
</body>
</html>
